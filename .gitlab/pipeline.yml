workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" 
    - if: $CI_COMMIT_BRANCH == "main" 
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ACTION == "pre-release"
    - if: $ACTION == "stable"

image: mcr.microsoft.com/dotnet/sdk:7.0

variables:
  ACTION:
    description: "Type of the release."
    value: "merge-request"
    options:
      - "merge-request"
      - "pre-release"
      - "stable"
  
  SONAR_SCANNER_KEY: "${CI_COMMIT_SHA}-SONARSCANNER"
  SONAR_SCANNER_PATH: "$CI_PROJECT_DIR/.dotnet/tools/sonarscanner"
  SONAR_ANALYSIS_DIRECTORY: "${PROJECT_SOLUTION_FOLDER}.sonarqube"
  SONAR_ORGANIZATION: "mihben-gitlab"
  SONAR_PROJECT_KEY: "mihben_strain"

  PROJECT_SOLUTION_FOLDER: "./src/"

  ARTIFACTS_PATH: "$CI_PROJECT_DIR/.artifacts"  

  VERSIONIZE_KEY: "${CI_COMMIT_SHA}-VERSIONIZE"
  VERSIONIZE_PATH: "${CI_COMMIT_SHA}-VERSIONIZE"
  VERSIONIZE_PRE_RELEASE_TAG: "rc"

  NUGET_ARTIFACTORY_DIRECTORY: "$ARTIFACTS_PATH/.nuget/"

include:
  - project: 'mihben/pipeline-templates'
    ref: feature/dotnet-template
    file: '/dotnet/scripts.yml'

stages:
  - .pre
  - build
  - test
  - deploy
  - .post

install-sonarscanner-job:
  stage: .pre
  cache:
    policy: push
    key: "${SONAR_SCANNER_KEY}"
    paths:
      - "${SONAR_SCANNER_PATH}"
  script:
  - !reference [.sonar, install]

install-versionize-job:
  stage: .pre
  cache:
    policy: push
    key: "${VERSIONIZE_KEY}"
    paths:
      - "${VERSIONIZE_PATH}"
  script:
  - !reference [.versionize, install]
  rules:
    - if: $ACTION == "pre-release"
    - if: $ACTION == "stable"

build-job:
  stage: build
  cache:
    policy: pull-push
    key: "${SONAR_SCANNER_KEY}"
    paths:
      - "${SONAR_SCANNER_PATH}"
      - "${SONAR_ANALYSIS_DIRECTORY}"
  script:
  - !reference [.dotnet, build]
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - $ARTIFACTS_PATH

qa-job:
  stage: test
  cache:
    policy: pull-push
    key: "${SONAR_SCANNER_KEY}"
    paths:
      - "${SONAR_SCANNER_PATH}"
      - "${SONAR_ANALYSIS_DIRECTORY}"
  script: 
  - !reference [.dotnet, test]
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ./**/*test-result.xml
      - ./**/*opencover.xml
    reports:
      junit:
        - ./**/*test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: ./**/*cobertura.xml
  after_script:
  - !reference [.sonar, upload]

push-job:
  stage: deploy
  cache:
    policy: pull
    key: "${VERSIONIZE_KEY}"
    paths:
      - "${VERSIONIZE_PATH}"
  script:
  - !reference [.versionize, pre-release]
  - !reference [.dotnet, push-nuget]
  rules:
    - if: $ACTION == "pre-release"

push-job:
  stage: deploy
  cache:
    policy: pull
    key: "${VERSIONIZE_KEY}"
    paths:
      - "${VERSIONIZE_PATH}"
  script:
  - !reference [.versionize, stable]
  - !reference [.dotnet, push-nuget]
  rules:
    - if: $ACTION == "stable"
  